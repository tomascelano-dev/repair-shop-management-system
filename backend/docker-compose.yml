services:
  postgres:
    image: postgres:16
    container_name: repairshop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repairshop
    # Ports are published by the dev/prod overrides (production keeps the database private).
    volumes:
      - repairshop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d repairshop"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repairshop-api
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Environment name, JWT, ConnectionString, Swagger/Seed flags and CORS are set in:
      # - docker-compose.dev.yml
      # - docker-compose.prod.yml
      HttpsRedirection__Enabled: "false"
      Database__Init: Migrate
      Database__ConnectRetries: "30"
      Database__ConnectDelayMs: "2000"
      Storage__Provider: Local
      Storage__Local__RootPath: /app/data/uploads
      # X-Forwarded-For is only trusted from Docker networks: a reverse proxy container on this network,
      # or one on the host (it reaches the container through the bridge gateway). Never expose the API
      # directly to the internet without a proxy in front.
      ReverseProxy__KnownNetworks__0: 172.16.0.0/12
      ReverseProxy__KnownNetworks__1: 192.168.0.0/16
    volumes:
      - repairshop_uploads:/app/data/uploads

volumes:
  repairshop_pgdata:
  repairshop_uploads: