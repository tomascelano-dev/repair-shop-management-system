# RepairShop · stack de producción detrás de un proxy existente (Caddy del host + Cloudflare).
# Uso, desde esta carpeta en el servidor:
#   cp .env.example .env        # completar (ver README.md)
#   docker compose up -d --build
# El sitio queda en http://127.0.0.1:${WEB_PORT}; el proxy del host publica ${DOMAIN} con HTTPS hacia ese puerto.
name: repairshop-taller

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: repairshop
      POSTGRES_USER: repairshop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairshop -d repairshop"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__RepairShopDb: Host=db;Port=5432;Database=repairshop;Username=repairshop;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Falta JWT_KEY en .env}
      # Cifra las claves que protegen tokens de Mercado Pago y certificados ARCA. Guardala también fuera del servidor.
      DataProtection__MasterKey: ${MASTER_KEY:?Falta MASTER_KEY en .env}
      App__FrontendBaseUrl: https://${DOMAIN:?Falta DOMAIN en .env}
      App__PublicApiUrl: https://${DOMAIN}
      Cors__AllowedOrigins__0: https://${DOMAIN}
      # localhost: el healthcheck del contenedor.
      AllowedHosts: ${DOMAIN};localhost
      Auth__RefreshCookie__Secure: "true"
      HttpsRedirection__Enabled: "false"
      Swagger__Enabled: "false"
      Seed__Enabled: "false"
      Database__Init: Migrate
      Database__ConnectRetries: "30"
      # Solo el contenedor web llega a la API (no tiene puertos publicados): se confía en su X-Forwarded-For.
      ReverseProxy__KnownNetworks__0: 10.0.0.0/8
      ReverseProxy__KnownNetworks__1: 172.16.0.0/12
      ReverseProxy__KnownNetworks__2: 192.168.0.0/16
      Storage__Provider: Local
      Storage__Local__RootPath: /app/data/uploads
      Notifications__Email__Provider: ${EMAIL_PROVIDER:-None}
      Notifications__Smtp__Host: ${SMTP_HOST:-}
      Notifications__Smtp__Port: ${SMTP_PORT:-587}
      Notifications__Smtp__Username: ${SMTP_USERNAME:-}
      Notifications__Smtp__Password: ${SMTP_PASSWORD:-}
      Notifications__Smtp__FromAddress: ${SMTP_FROM:-}
      Notifications__Smtp__FromName: ${SMTP_FROM_NAME:-RepairShop}
      Notifications__WhatsApp__Provider: ${WHATSAPP_PROVIDER:-None}
      Notifications__Twilio__AccountSid: ${TWILIO_ACCOUNT_SID:-}
      Notifications__Twilio__AuthToken: ${TWILIO_AUTH_TOKEN:-}
      Notifications__Twilio__WhatsAppFrom: ${TWILIO_WHATSAPP_FROM:-}
      Notifications__Meta__PhoneNumberId: ${META_PHONE_NUMBER_ID:-}
      Notifications__Meta__AccessToken: ${META_ACCESS_TOKEN:-}
      Notifications__Meta__TemplateName: ${META_TEMPLATE_NAME:-}
      Ai__Provider: ${AI_PROVIDER:-None}
      Ai__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      # Suscripciones de los talleres: alta pública con prueba gratis y cobro mensual (ver README).
      Billing__SignupEnabled: ${SIGNUP_ENABLED:-false}
      Billing__ContactEmail: ${CONTACT_EMAIL:-}
      Billing__LegalName: ${LEGAL_NAME:-}
      Billing__TrialDays: ${TRIAL_DAYS:-14}
      # Cobro con Mercado Pago: una cuenta de la plataforma por país. Un país se habilita (alta y cobro) solo
      # cuando tiene access token, secreto del webhook y los tres precios. Argentina viene con precios por defecto.
      Billing__Countries__AR__AccessToken: ${MP_BILLING_ACCESS_TOKEN:-}
      Billing__Countries__AR__WebhookSecret: ${MP_BILLING_WEBHOOK_SECRET:-}
      Billing__Countries__AR__Prices__Basic: ${PRICE_ARS_BASIC:-29900}
      Billing__Countries__AR__Prices__Standard: ${PRICE_ARS_STANDARD:-44900}
      Billing__Countries__AR__Prices__Pro: ${PRICE_ARS_PRO:-74900}
      Billing__Countries__BR__AccessToken: ${MP_BILLING_BR_ACCESS_TOKEN:-}
      Billing__Countries__BR__WebhookSecret: ${MP_BILLING_BR_WEBHOOK_SECRET:-}
      Billing__Countries__BR__Prices__Basic: ${PRICE_BRL_BASIC:-0}
      Billing__Countries__BR__Prices__Standard: ${PRICE_BRL_STANDARD:-0}
      Billing__Countries__BR__Prices__Pro: ${PRICE_BRL_PRO:-0}
      Billing__Countries__CL__AccessToken: ${MP_BILLING_CL_ACCESS_TOKEN:-}
      Billing__Countries__CL__WebhookSecret: ${MP_BILLING_CL_WEBHOOK_SECRET:-}
      Billing__Countries__CL__Prices__Basic: ${PRICE_CLP_BASIC:-0}
      Billing__Countries__CL__Prices__Standard: ${PRICE_CLP_STANDARD:-0}
      Billing__Countries__CL__Prices__Pro: ${PRICE_CLP_PRO:-0}
      Billing__Countries__CO__AccessToken: ${MP_BILLING_CO_ACCESS_TOKEN:-}
      Billing__Countries__CO__WebhookSecret: ${MP_BILLING_CO_WEBHOOK_SECRET:-}
      Billing__Countries__CO__Prices__Basic: ${PRICE_COP_BASIC:-0}
      Billing__Countries__CO__Prices__Standard: ${PRICE_COP_STANDARD:-0}
      Billing__Countries__CO__Prices__Pro: ${PRICE_COP_PRO:-0}
      Billing__Countries__MX__AccessToken: ${MP_BILLING_MX_ACCESS_TOKEN:-}
      Billing__Countries__MX__WebhookSecret: ${MP_BILLING_MX_WEBHOOK_SECRET:-}
      Billing__Countries__MX__Prices__Basic: ${PRICE_MXN_BASIC:-0}
      Billing__Countries__MX__Prices__Standard: ${PRICE_MXN_STANDARD:-0}
      Billing__Countries__MX__Prices__Pro: ${PRICE_MXN_PRO:-0}
      Billing__Countries__PE__AccessToken: ${MP_BILLING_PE_ACCESS_TOKEN:-}
      Billing__Countries__PE__WebhookSecret: ${MP_BILLING_PE_WEBHOOK_SECRET:-}
      Billing__Countries__PE__Prices__Basic: ${PRICE_PEN_BASIC:-0}
      Billing__Countries__PE__Prices__Standard: ${PRICE_PEN_STANDARD:-0}
      Billing__Countries__PE__Prices__Pro: ${PRICE_PEN_PRO:-0}
      Billing__Countries__UY__AccessToken: ${MP_BILLING_UY_ACCESS_TOKEN:-}
      Billing__Countries__UY__WebhookSecret: ${MP_BILLING_UY_WEBHOOK_SECRET:-}
      Billing__Countries__UY__Prices__Basic: ${PRICE_UYU_BASIC:-0}
      Billing__Countries__UY__Prices__Standard: ${PRICE_UYU_STANDARD:-0}
      Billing__Countries__UY__Prices__Pro: ${PRICE_UYU_PRO:-0}
      # Medición de anuncios (Google Analytics 4, Google Ads, píxel y API de conversiones de Meta).
      Tracking__Ga4Id: ${GA4_ID:-}
      Tracking__GoogleAdsId: ${GOOGLE_ADS_ID:-}
      Tracking__GoogleAdsSignupLabel: ${GOOGLE_ADS_SIGNUP_LABEL:-}
      Tracking__GoogleAdsPurchaseLabel: ${GOOGLE_ADS_PURCHASE_LABEL:-}
      Tracking__MetaPixelId: ${META_PIXEL_ID:-}
      Tracking__MetaCapiToken: ${META_CAPI_TOKEN:-}
      Tracking__MetaTestEventCode: ${META_TEST_EVENT_CODE:-}
    volumes:
      # Fotos, firmas, logos y adjuntos de las órdenes.
      - app_data:/app/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/readyz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Shown in the pre-rendered Terms, Privacy and Refunds pages (the API sends the same values to the app).
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      LEGAL_NAME: ${LEGAL_NAME:-}
      # Absolute URLs for search engines and link previews: canonical, hreflang, Open Graph, sitemap.xml, robots.txt.
      PUBLIC_ORIGIN: https://${DOMAIN}
    ports:
      - "127.0.0.1:${WEB_PORT:-8086}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: repairshop
      PGUSER: repairshop
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-6}
      # Copia diaria fuera del servidor, cifrada, a Cloudflare R2: correr una vez
      # `docker compose run --rm backup setup-r2.sh` y poner RCLONE_REMOTE=r2crypt: en .env (ver README).
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      OFFSITE_KEEP_DAYS: ${OFFSITE_KEEP_DAYS:-30}
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - backups:/backups
      - app_data:/app/data/uploads:ro
      # Credenciales de R2 y clave de cifrado (las escribe setup-r2.sh; no se versionan).
      - ./backup/rclone:/config/rclone

volumes:
  db_data:
  app_data:
  backups:
