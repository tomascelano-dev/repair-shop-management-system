# Production overrides
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# IMPORTANT:
# - Swagger and Seed are forced OFF in production.
# - Provide secrets via env/.env (gitignored) or your secret manager.
services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # No published ports: only the API reaches the database.

  api:
    restart: unless-stopped
    ports:
      # Bound to localhost: publish it through your TLS reverse proxy (Caddy, nginx, Traefik).
      - "${API_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Secrets (do NOT commit real values)
      ConnectionStrings__RepairShopDb: ${CONNECTIONSTRINGS__REPAIRSHOPDB}
      Jwt__Key: ${JWT__KEY}
      # Optional (defaults to RepairShop if not set)
      Jwt__Issuer: ${JWT__ISSUER:-RepairShop}
      Jwt__Audience: ${JWT__AUDIENCE:-RepairShop}

      # Hard OFF in prod (the app will refuse to start if you try true)
      Swagger__Enabled: "false"
      Seed__Enabled: "false"

      # CORS must be explicit in prod
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_0}
      # Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_1}

      # Must NOT be "*" in prod
      AllowedHosts: ${ALLOWED_HOSTS}

      # Public URLs (tracking links, QR codes, Mercado Pago webhooks)
      App__FrontendBaseUrl: ${APP_FRONTEND_URL}
      App__PublicApiUrl: ${APP_PUBLIC_API_URL}

      # Encrypts the key ring that protects shop secrets (MP tokens, ARCA certificates). Keep it in your secret manager.
      DataProtection__MasterKey: ${DATAPROTECTION_MASTERKEY}

      # Optional integrations
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__S3__Bucket: ${STORAGE_S3_BUCKET:-}
      Storage__S3__ServiceUrl: ${STORAGE_S3_SERVICE_URL:-}
      Storage__S3__AccessKey: ${STORAGE_S3_ACCESS_KEY:-}
      Storage__S3__SecretKey: ${STORAGE_S3_SECRET_KEY:-}
      Notifications__WhatsApp__Provider: ${NOTIFICATIONS_WHATSAPP_PROVIDER:-None}
      Notifications__Meta__PhoneNumberId: ${META_PHONE_NUMBER_ID:-}
      Notifications__Meta__AccessToken: ${META_ACCESS_TOKEN:-}
      Notifications__Meta__TemplateName: ${META_TEMPLATE_NAME:-}
      Notifications__Email__Provider: ${NOTIFICATIONS_EMAIL_PROVIDER:-None}
      Notifications__Smtp__Host: ${SMTP_HOST:-}
      Notifications__Smtp__Username: ${SMTP_USERNAME:-}
      Notifications__Smtp__Password: ${SMTP_PASSWORD:-}
      Notifications__Smtp__FromAddress: ${SMTP_FROM:-}
      Ai__Provider: ${AI_PROVIDER:-None}
      Ai__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
