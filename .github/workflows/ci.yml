name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: Backend (build + unit + integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore RepairShop.sln
      - name: Build
        run: dotnet build RepairShop.sln -c Release --no-restore -warnaserror
      - name: Test
        env:
          # Integration tests create and drop their own databases on this server.
          REPAIRSHOP_TEST_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=postgres
        run: dotnet test RepairShop.sln -c Release --no-build --logger "trx;LogFilePrefix=results" --results-directory TestResults
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/TestResults

  frontend:
    name: Frontend (lint + types + unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images and deploy stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t repairshop-api:ci backend
      - name: Build web image (frontend + Caddy)
        run: docker build -f deploy/web.Dockerfile -t repairshop-web:ci .
      - name: Validate the production compose file
        working-directory: deploy
        env:
          DOMAIN: ci.example.com
          DB_PASSWORD: ci
          JWT_KEY: ci-signing-key-0123456789abcdef0123456789
          MASTER_KEY: ci
        run: docker compose -f compose.yml config --quiet
      - name: Validate the Caddyfile
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Public pages have content without JavaScript
        # Payment-provider reviewers and crawlers read the HTML as served; the SPA shell alone is empty.
        run: |
          docker run -d --name web -p 8099:80 repairshop-web:ci
          for i in $(seq 1 20); do curl -fsS -o /dev/null http://127.0.0.1:8099/precios && break; sleep 1; done
          check() { curl -fsS "http://127.0.0.1:8099$1" | grep -q "$2" || { echo "$1 does not contain: $2"; exit 1; }; }
          check /precios 'Profesional'
          check /terminos 'Términos del servicio'
          check /privacidad 'Política de privacidad'
          check /reembolsos 'Política de reembolsos'
          check / 'href="/reembolsos"'
          check /orders 'id="root" class="h-full"></div>'

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: repairshop_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start API (Development seed with demo data)
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:8080
          ConnectionStrings__RepairShopDb: Host=localhost;Port=5432;Database=repairshop_e2e;Username=postgres;Password=postgres
          Jwt__Key: ci-e2e-signing-key-0123456789abcdef0123456789
          Seed__Enabled: "true"
          Seed__DemoData: "true"
          App__FrontendBaseUrl: http://localhost:5173
          App__PublicApiUrl: http://127.0.0.1:8080
          Notifications__WhatsApp__Provider: Simulated
          Notifications__Email__Provider: Simulated
          Jobs__Enabled: "false"
          # Plans are activated without charging (no payment provider in CI).
          Billing__AllowSimulated: "true"
        run: |
          dotnet build src/RepairShop.Api/RepairShop.Api.csproj -c Release
          # Run from the output folder: the content root is the working directory, and appsettings.json
          # (JWT issuer and audience among others) is read from there.
          cd src/RepairShop.Api/bin/Release/net8.0
          nohup dotnet RepairShop.Api.dll > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then echo "API is up"; exit 0; fi
            sleep 2
          done
          echo "API did not start"; cat "$RUNNER_TEMP/api.log"; exit 1

      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        env:
          VITE_PROXY_TARGET: http://127.0.0.1:8080
        run: npm run test:e2e

      - name: Upload report and API log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/api.log
